<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <title>Calendario · Musicala</title>
  <meta name="description" content="Calendario interno de Musicala: eventos, responsables, estados y recordatorios." />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Social (Open Graph / Twitter) -->
  <meta property="og:title" content="Calendario · Musicala" />
  <meta property="og:description" content="Calendario interno de Musicala: eventos, responsables, estados y recordatorios." />
  <meta property="og:type" content="website" />
  <!-- <meta property="og:image" content="./og-calendar.png" /> -->
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Favicons (NO PWA; solo estándar) -->
  <link rel="icon" href="./favicon.ico" />
  <!-- Opcionales si luego tienen pngs -->
  <!-- <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png" /> -->
  <!-- <link rel="icon" type="image/png" sizes="16x16" href="./icons/icon-16.png" /> -->

  <!-- Fuente (preconnect + load no bloqueante) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />

  <!-- Preload logo (mejor percepción al cargar) -->
  <link rel="preload" as="image" href="./logo.png" />

  <!-- Estilos -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Pequeño hardening -->
  <meta name="robots" content="noindex, nofollow" />
</head>

<body>
  <!-- Accesibilidad: se ve SOLO con teclado (CSS controla) -->
  <a class="skip-link" href="#app">Saltar al contenido</a>

  <!-- Live region global para mensajes importantes -->
  <div class="sr-only" role="status" aria-live="polite" aria-atomic="true" id="srStatus"></div>

  <noscript>
    <div style="max-width:900px;margin:16px auto;padding:14px;border:1px solid rgba(15,23,42,.14);border-radius:14px;background:#fff;">
      <strong>Este calendario necesita JavaScript.</strong>
      <div style="margin-top:6px;color:#334155;">
        Actívalo en tu navegador para poder iniciar sesión, cargar eventos y usar el calendario.
      </div>
    </div>
  </noscript>

  <!-- ======================
       HEADER
  ======================= -->
  <header class="header" role="banner">
    <div class="header-left">
      <div class="brand" aria-label="Musicala">
        <img
          src="./logo.png"
          alt="Musicala"
          class="brand-logo"
          loading="eager"
          decoding="async"
          width="44"
          height="44"
        />
        <div class="brand-text">
          <span class="brand-title">Calendario</span>
          <span class="brand-subtitle">Musicala</span>
        </div>
      </div>

      <span id="userEmail" class="user-email hidden" aria-live="polite" aria-atomic="true"></span>
    </div>

    <div class="header-right" aria-label="Sesión">
      <button
        id="btnLogin"
        class="btn primary"
        type="button"
        aria-label="Iniciar sesión"
      >
        Iniciar sesión
      </button>

      <button
        id="btnLogout"
        class="btn ghost hidden"
        type="button"
        aria-label="Cerrar sesión"
      >
        Salir
      </button>
    </div>
  </header>

  <!-- ======================
       BLOQUE NO AUTORIZADO
  ======================= -->
  <section
    id="unauthorized"
    class="unauthorized hidden"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  >
    <p>
      Este calendario es de uso interno.<br />
      Si crees que deberías tener acceso, revisa el correo con el que iniciaste sesión.
    </p>
  </section>

  <!-- ======================
       APP PRINCIPAL
  ======================= -->
  <main id="app" class="app hidden" role="main" tabindex="-1">

    <!-- Toolbar -->
    <section class="toolbar" aria-label="Navegación de mes">
      <div class="toolbar-left" role="group" aria-label="Cambiar mes">
        <button
          id="btnPrevMonth"
          class="btn ghost"
          type="button"
          aria-label="Mes anterior"
          title="Mes anterior"
        >
          ◀
        </button>

        <h2 id="currentMonth" aria-live="polite" aria-atomic="true">Mes Año</h2>

        <button
          id="btnNextMonth"
          class="btn ghost"
          type="button"
          aria-label="Mes siguiente"
          title="Mes siguiente"
        >
          ▶
        </button>
      </div>

      <div class="toolbar-right" role="group" aria-label="Acciones">
        <button
          id="btnToday"
          class="btn ghost"
          type="button"
          title="Ir a hoy"
          aria-label="Ir a hoy"
        >
          Hoy
        </button>

        <button
          id="btnNewEvent"
          class="btn primary"
          type="button"
          title="Crear nuevo evento"
          aria-label="Crear nuevo evento"
          aria-haspopup="dialog"
          aria-controls="eventModal"
        >
          ＋ Nuevo evento
        </button>
      </div>
    </section>

    <!-- ======================
         Panel Hoy / Próximos 7
    ======================= -->
    <section class="overview" aria-label="Resumen">
      <div class="overview-card" id="overviewToday">
        <div class="overview-title">Hoy</div>
        <div class="overview-body" id="todayList" aria-live="polite" aria-atomic="true">
          <span class="muted">Sin eventos</span>
        </div>
      </div>

      <div class="overview-card" id="overviewNext">
        <div class="overview-title">Próximos 7 días</div>
        <div class="overview-body" id="nextList" aria-live="polite" aria-atomic="true">
          <span class="muted">Sin eventos</span>
        </div>
      </div>
    </section>

    <!-- ======================
         Búsqueda + Vista
    ======================= -->
    <section class="controls" aria-label="Controles">
      <div class="controls-left">
        <label class="sr-only" for="searchEvents">Buscar eventos</label>
        <input
          id="searchEvents"
          type="search"
          placeholder="Buscar por título, notas o responsable…"
          autocomplete="off"
          spellcheck="false"
          inputmode="search"
          aria-label="Buscar eventos"
          aria-keyshortcuts="Control+K Meta+K"
        />
      </div>

      <div class="controls-right" role="tablist" aria-label="Vista">
        <button
          id="btnViewMonth"
          class="seg active"
          type="button"
          aria-selected="true"
          role="tab"
          aria-controls="monthView"
        >
          Mes
        </button>

        <button
          id="btnViewList"
          class="seg"
          type="button"
          aria-selected="false"
          role="tab"
          aria-controls="listView"
        >
          Lista
        </button>
      </div>
    </section>

    <!-- ======================
         Filtros
         ✅ IDs alineados con ui.js:
            filterCategory / filterStatus / filterAssignedTo
    ======================= -->
    <section class="filters" aria-label="Filtros">
      <div class="filter-row">
        <div class="filter-field">
          <label for="filterCategory">Filtrar por categoría</label>
          <select id="filterCategory" aria-label="Filtrar por categoría">
            <option value="">Todas las categorías</option>
          </select>
        </div>

        <div class="filter-field">
          <label for="filterStatus">Filtrar por estado</label>
          <select id="filterStatus" aria-label="Filtrar por estado">
            <option value="">Todos los estados</option>
            <option value="pending">Pendiente</option>
            <option value="done">Hecho</option>
            <option value="cancelled">Cancelado</option>
          </select>
        </div>

        <div class="filter-field">
          <label for="filterAssignedTo">Filtrar por responsable</label>
          <select id="filterAssignedTo" aria-label="Filtrar por responsable">
            <option value="">Todas las personas</option>
          </select>
        </div>
      </div>
    </section>

    <!-- ======================
         Vista Mes (Calendario)
    ======================= -->
    <section class="calendar" id="monthView" aria-label="Calendario mensual">
      <div
        class="calendar-grid"
        id="calendarGrid"
        role="grid"
        aria-label="Cuadrícula del calendario"
        aria-readonly="true"
      >
        <!-- render por JS -->
      </div>
    </section>

    <!-- ======================
         Vista Lista
    ======================= -->
    <section class="list-view hidden" id="listView" aria-label="Lista de eventos">
      <div class="list-head">
        <h3 id="listTitle">Eventos</h3>
        <div class="list-meta" id="listMeta" aria-live="polite" aria-atomic="true"></div>
      </div>

      <div class="list-body" id="listBody" aria-live="polite" aria-atomic="false">
        <!-- render por JS -->
      </div>
    </section>

  </main>

  <!-- ======================
       MODAL EVENTO
       ✅ IDs alineados con ui.js:
          eventAssignedTo + eventRecurrence
  ======================= -->
  <div
    id="eventModal"
    class="modal hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
    aria-describedby="modalDesc"
  >
    <div class="modal-content" role="document">
      <div class="modal-head">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
          <div>
            <h3 id="modalTitle">Nuevo evento</h3>
            <p id="modalDesc" class="muted">Crea o edita una tarea del calendario.</p>
          </div>

          <!-- Botón cerrar -->
          <button
            type="button"
            class="btn ghost"
            aria-label="Cerrar"
            title="Cerrar (Esc)"
            id="btnCloseModalX"
            data-modal-close="true"
          >
            ✕
          </button>
        </div>
      </div>

      <form id="eventForm" novalidate>
        <!-- Guard para enter key -->
        <button type="submit" class="sr-only" aria-hidden="true" tabindex="-1">submit</button>

        <label>
          Título
          <input
            type="text"
            id="eventTitle"
            required
            maxlength="120"
            autocomplete="off"
            placeholder="Ej: Reunión con equipo / Entregar informe…"
          />
        </label>

        <div class="form-2col">
          <label>
            Categoría
            <select id="eventCategory" required aria-label="Categoría"></select>
          </label>

          <label>
            Fecha
            <input type="date" id="eventDate" required aria-label="Fecha" />
          </label>
        </div>

        <div class="form-2col">
          <label>
            Estado
            <select id="eventStatus" aria-label="Estado">
              <option value="pending">Pendiente</option>
              <option value="done">Hecho</option>
              <option value="cancelled">Cancelado</option>
            </select>
          </label>

          <label>
            Responsable
            <select id="eventAssignedTo" aria-label="Responsable" autocomplete="off">
              <option value="">Sin asignar</option>
              <!-- ui.js rellena opciones -->
            </select>
          </label>
        </div>

        <div class="form-2col">
          <label>
            Repetición
            <select id="eventRecurrence" aria-label="Repetición"></select>
          </label>

          <div aria-hidden="true"></div>
        </div>

        <label>
          Notas
          <textarea
            id="eventNotes"
            rows="3"
            maxlength="1200"
            placeholder="Detalles, links, contexto…"
          ></textarea>
        </label>

        <div class="modal-actions">
          <button type="button" id="btnDeleteEvent" class="btn danger hidden" aria-label="Eliminar evento">
            Eliminar
          </button>

          <div class="modal-actions-right">
            <button type="button" id="btnCancelModal" class="btn ghost" aria-label="Cancelar" data-modal-close="true">
              Cancelar
            </button>
            <button type="submit" class="btn primary" id="btnSaveEvent" aria-label="Guardar evento">
              Guardar
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Overlay -->
  <div id="modalOverlay" class="overlay hidden" aria-hidden="true" data-modal-close="true"></div>

  <!-- Toast host -->
  <div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="true"></div>

  <!-- ======================
       SCRIPTS
       Nota: mantener el orden ayuda a evitar “undefined imports”
  ======================= -->
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/auth.js"></script>

  <script type="module" src="js/constants.js"></script>
  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/db.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/app.js"></script>

  <!-- Mini-hardening UX (sin tocar tu ui.js): close modal con overlay/X y Ctrl+K focus search -->
  <script>
    (function () {
      const $ = (q) => document.querySelector(q);
      const overlay = $('#modalOverlay');
      const modal = $('#eventModal');
      const btnCancel = $('#btnCancelModal');
      const btnCloseX = $('#btnCloseModalX');
      const search = $('#searchEvents');

      function tryCloseModal() {
        if (!modal || modal.classList.contains('hidden')) return;
        // Preferimos disparar la misma ruta del sistema (para que ui.js limpie estado)
        if (btnCancel) btnCancel.click();
      }

      // Delegado: elementos con data-modal-close cierran
      document.addEventListener('click', (e) => {
        const t = e.target;
        if (t && t.closest && t.closest('[data-modal-close="true"]')) {
          e.preventDefault();
          tryCloseModal();
        }
      });

      // Escape cierra modal (si ui.js no lo hace)
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') tryCloseModal();

        // Ctrl+K / Cmd+K enfoca búsqueda (sin romper shortcuts del sistema)
        const isK = (e.key || '').toLowerCase() === 'k';
        const metaOrCtrl = e.metaKey || e.ctrlKey;
        if (metaOrCtrl && isK) {
          e.preventDefault();
          if (search) {
            search.focus();
            search.select?.();
          }
        }
      });

      // Click en overlay cierra modal (fallback)
      if (overlay) overlay.addEventListener('click', tryCloseModal);

      // Si por alguna razón ui.js no engancha el X
      if (btnCloseX) btnCloseX.addEventListener('click', tryCloseModal);
    })();
  </script>
</body>
</html>
